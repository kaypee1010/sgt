<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Attendance Control — Faculty</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:linear-gradient(135deg,#f5f1e8,#e8e3d8);min-height:100vh;padding:20px}
.wrap{max-width:520px;margin:0 auto}
.header{background:linear-gradient(135deg,#8B3A3A,#6B2D2D);color:#fff;padding:24px 28px;border-radius:10px 10px 0 0;display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.3);overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.hinfo h1{font-size:18px;margin-bottom:2px}
.hinfo p{font-size:12px;opacity:.9}

.body{background:#fff;padding:32px 28px;border-radius:0 0 10px 10px;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center}

.status-label{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;font-family:'Courier New',monospace}

.toggle-wrap{display:flex;justify-content:center;margin-bottom:22px}
.toggle{width:120px;height:56px;border-radius:30px;background:#ccc;position:relative;cursor:pointer;transition:background .3s;border:none}
.toggle.on{background:#2e7d6b}
.toggle .knob{position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:20px}
.toggle.on .knob{left:68px}
.toggle:disabled{opacity:.6;cursor:not-allowed}

.state-text{font-size:20px;font-weight:700;margin-bottom:6px}
.state-text.closed{color:#c0392b}
.state-text.open{color:#2e7d6b}
.state-sub{font-size:12.5px;color:#888;margin-bottom:24px}

.code-box{display:none;background:#f5ede8;border:2px dashed #8B3A3A;border-radius:12px;padding:26px;margin-bottom:20px}
.code-box .lbl{font-size:12px;color:#8B3A3A;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.code-box .code{font-family:'Courier New',monospace;font-size:52px;font-weight:900;color:#8B3A3A;letter-spacing:10px}
.code-box .hint{font-size:12px;color:#888;margin-top:10px}
.code-box .elapsed{font-family:'Courier New',monospace;font-size:12px;color:#aaa;margin-top:8px}

.err-box{background:#fbeaea;color:#c0392b;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}
.info-box{background:#e3f2ef;color:#2e7d6b;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;display:none}

.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.links a{font-size:12px;color:#8B3A3A;text-decoration:none;border:1px solid #d0c8b8;padding:7px 16px;border-radius:16px}
.links a:hover{background:#f5ede8;border-color:#8B3A3A}
.footer{text-align:center;font-size:11px;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo"><img src="KP_Singh.png" alt="KP Singh" onerror="this.style.display='none'"></div>
    <div class="hinfo">
      <h1>Attendance Window Control</h1>
      <p>SGT University · Faculty Only</p>
    </div>
  </div>
  <div class="body">
    <div id="errBox" class="err-box"></div>
    <div id="infoBox" class="info-box"></div>

    <div class="status-label">Attendance Window</div>
    <div class="toggle-wrap">
      <button class="toggle" id="toggleBtn" onclick="handleToggle()"><span class="knob">🔒</span></button>
    </div>
    <div class="state-text closed" id="stateText">CLOSED</div>
    <div class="state-sub" id="stateSub">Students cannot check in right now.</div>

    <div class="code-box" id="codeBox">
      <div class="lbl">Share This Code With Students</div>
      <div class="code" id="codeValue">----</div>
      <div class="hint">Read it aloud, write it on a board, or message it to the group.</div>
      <div class="elapsed" id="elapsedText"></div>
    </div>

    <div class="links">
      <a href="1️⃣student_attendance.html" target="_blank">📱 Student Check-in Page</a>
      <a href="3️⃣dashboard.html" target="_blank">📊 Live Dashboard</a>
    </div>
  </div>
  <div class="footer">kpsingh.in</div>
</div>

<script>
'use strict';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwP4xFqPihu8dFcvazG_tm5OENKSHMvUMrWSiPj9gmQFEYEUHlFSURT8z8kBAchaTp1/exec'; // same URL used by the student page

function checkSheetUrl() {
  if (GAS_URL.indexOf('PASTE_') === 0) return 'Setup incomplete: GAS_URL has not been set yet.';
  if (GAS_URL.indexOf('/macros/s/') === -1 || GAS_URL.indexOf('/exec') === -1) return 'GAS_URL does not look like a valid Web App URL.';
  return null;
}

function $(id){ return document.getElementById(id); }

var isOpen = false, currentCode = null, openedAt = null, busy = false, elapsedInterval = null;

function showErr(text) {
  $('errBox').textContent = text; $('errBox').style.display = 'block';
  $('infoBox').style.display = 'none';
}
function showInfo(text) {
  $('infoBox').textContent = text; $('infoBox').style.display = 'block';
  $('errBox').style.display = 'none';
  setTimeout(function(){ $('infoBox').style.display = 'none'; }, 4000);
}

function renderState() {
  var toggle = $('toggleBtn');
  toggle.classList.toggle('on', isOpen);
  toggle.querySelector('.knob').textContent = isOpen ? '🔓' : '🔒';
  $('stateText').textContent = isOpen ? 'OPEN' : 'CLOSED';
  $('stateText').className = 'state-text ' + (isOpen ? 'open' : 'closed');
  $('stateSub').textContent = isOpen
    ? 'Students can check in using the code below.'
    : 'Students cannot check in right now.';
  $('codeBox').style.display = (isOpen && currentCode) ? 'block' : 'none';
  if (isOpen && currentCode) $('codeValue').textContent = currentCode;

  clearInterval(elapsedInterval);
  if (isOpen && openedAt) {
    elapsedInterval = setInterval(updateElapsed, 1000);
    updateElapsed();
  }
}

function updateElapsed() {
  if (!openedAt) return;
  var secs = Math.floor((Date.now() - new Date(openedAt).getTime()) / 1000);
  var m = Math.floor(secs / 60), s = secs % 60;
  $('elapsedText').textContent = 'Open for ' + m + 'm ' + String(s).padStart(2,'0') + 's';
}

// ── Sync toggle state on load (in case faculty opens this on a 2nd device) ──
function syncStatus() {
  var problem = checkSheetUrl();
  if (problem) { showErr(problem); return; }
  fetch(GAS_URL + '?action=session_status')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.status !== 'ok') return;
      isOpen = !!d.active;
      openedAt = d.openedAt;
      // Note: code itself is never returned by this endpoint (by design).
      // If this device didn't open the session, we show OPEN state but
      // without the code — faculty should use the device that opened it,
      // or close and reopen to get a fresh code on this device.
      if (isOpen && !currentCode) {
        $('codeBox').style.display = 'block';
        $('codeValue').textContent = '(check the device that opened this)';
      }
      renderState();
    })
    .catch(function(){});
}

function handleToggle() {
  if (busy) return;
  var problem = checkSheetUrl();
  if (problem) { showErr(problem); return; }

  busy = true;
  $('toggleBtn').disabled = true;

  if (!isOpen) {
    fetch(GAS_URL, {
      method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({type:'session_start'})
    })
    .then(function(r){ return r.json(); })
    .then(function(result){
      if (result && result.success) {
        isOpen = true; currentCode = result.code; openedAt = result.openedAt;
        renderState();
        showInfo('Attendance window opened. Code: ' + result.code);
      } else {
        showErr((result && result.error) || 'Could not open the window.');
      }
    })
    .catch(function(){ showErr('Network error — check connection and try again.'); })
    .finally(function(){ busy = false; $('toggleBtn').disabled = false; });
  } else {
    fetch(GAS_URL, {
      method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({type:'session_close'})
    })
    .then(function(r){ return r.json(); })
    .then(function(result){
      if (result && result.success) {
        isOpen = false; currentCode = null; openedAt = null;
        renderState();
        showInfo('Attendance window closed.');
      } else {
        showErr((result && result.error) || 'Could not close the window.');
      }
    })
    .catch(function(){ showErr('Network error — check connection and try again.'); })
    .finally(function(){ busy = false; $('toggleBtn').disabled = false; });
  }
}

syncStatus();
setInterval(syncStatus, 15000);
</script>
</body>
</html>
