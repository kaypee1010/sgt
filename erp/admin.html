<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoP Attendance — Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:linear-gradient(135deg,#f5f1e8,#e8e3d8);min-height:100vh;padding:20px}
.wrap{max-width:640px;margin:0 auto}
.header{background:linear-gradient(135deg,#8B3A3A,#6B2D2D);color:#fff;padding:24px 28px;border-radius:10px 10px 0 0}
.header h1{font-size:21px;margin-bottom:3px}
.header p{font-size:13px;opacity:.9}
.body{background:#fff;padding:28px;border-radius:0 0 10px 10px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.pin-field{margin-bottom:20px;padding:14px 16px;background:#fdf8f3;border:1.5px solid #e0d5c0;border-radius:8px}
.pin-field label{display:block;font-size:12px;font-weight:700;color:#8B3A3A;margin-bottom:6px}
.pin-field input{width:100%;padding:9px 11px;border:1px solid #d0c8b8;border-radius:5px;font-size:14px;font-family:inherit}
.pin-hint{font-size:10.5px;color:#999;margin-top:5px}
.section-card{border:2px solid #d0c8b8;border-radius:10px;padding:20px;margin-bottom:18px;background:#fafafa}
.section-card.live{border-color:#8B3A3A;background:#fdf8f3}
.sec-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-title{font-size:17px;font-weight:bold;color:#8B3A3A}
.subject-select,.cs-select{width:100%;padding:9px 11px;border:1px solid #d0c8b8;border-radius:5px;font-size:14px;font-family:inherit;margin-bottom:10px;background:#fff}
.cs-label{font-size:11px;font-weight:700;color:#777;margin-bottom:4px;display:block}
.cs-extra{display:none;margin-bottom:10px}
.cs-extra input{width:100%;padding:9px 11px;border:1px solid #d0c8b8;border-radius:5px;font-size:13px;font-family:inherit;margin-bottom:8px}
.cs-hint{font-size:10.5px;color:#999;margin:-4px 0 10px 0}
.btn-savestatus{display:none;width:100%;padding:10px;background:#6B7B8C;color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.toggle-label{font-size:12px;font-weight:700;color:#555}
.toggle{position:relative;width:58px;height:30px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle input:disabled + .slider{opacity:.45;cursor:not-allowed}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:30px;transition:.2s}
.slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked + .slider{background:#8B3A3A}
input:checked + .slider:before{transform:translateX(28px)}
.toggle-gate-note{font-size:10.5px;color:#a55;margin-bottom:10px;display:none}
.status-line{font-size:13px;font-weight:600;margin-bottom:10px}
.status-open{color:#1a5c2a}
.status-closed{color:#888}
.counts{display:flex;gap:10px;margin-top:10px}
.count-box{flex:1;text-align:center;padding:10px 6px;border-radius:8px;background:#fff;border:1px solid #eee}
.count-box .num{font-size:26px;font-weight:900;color:#8B3A3A}
.count-box.green .num{color:#1a5c2a}
.count-box.red .num{color:#c0392b}
.count-box .lbl{font-size:10px;color:#888;margin-top:2px}
.refresh-note{font-size:10px;color:#aaa;margin-top:8px;text-align:center}
.msg{padding:12px 16px;border-radius:5px;margin-bottom:16px;font-size:14px;display:none}
.msg.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.msg.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.msg.info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PoP Attendance — Admin</h1>
    <p>B.Tech Sem 5 · School of Engineering & Technology, SGT University</p>
  </div>
  <div class="body">
    <div id="msg" class="msg" role="alert"></div>

    <div class="pin-field">
      <label for="pin">Admin PIN (required to open/close a session or log a class status)</label>
      <input type="password" id="pin" placeholder="Enter shared admin PIN" autocomplete="off">
      <div class="pin-hint">Kept in this browser tab only — not saved. Ask K.P. Singh if you don't have it.</div>
    </div>

    <div id="cardsWrap"></div>

    <div class="refresh-note">Live counts auto-refresh every 15 seconds while a session is open.</div>
  </div>
</div>

<script>
'use strict';
var GAS_URL = 'PASTE_YOUR_APPS_SCRIPT_/exec_URL_HERE';
var FETCH_TIMEOUT_MS = 15000;
var REFRESH_MS = 15000;

var SECTION_CONFIG = {
  '5A': {
    subjects: [
      { code: 'DAA', name: "Design and Analysis of Algorithms", requiresDesk: false },
      { code: 'DAAL', name: "Design and Analysis of Algorithms Lab", requiresDesk: true },
      { code: 'CD', name: "Compiler Design", requiresDesk: false },
      { code: 'CDL', name: "Compiler Design Lab", requiresDesk: true },
      { code: 'DBMS', name: "Database Management Systems", requiresDesk: false },
      { code: 'DBMSL', name: "Database Management Systems Lab", requiresDesk: true },
      { code: 'IVP', name: "Image and Video Processing", requiresDesk: false },
      { code: 'PDCB', name: "Personality Development & Career Building", requiresDesk: false },
      { code: 'BPLSE', name: "Blockchain Policy: Legal, Social and Economic Impact", requiresDesk: false },
      { code: 'ITR1', name: "Industrial Training-I", requiresDesk: false },
      { code: 'SEC3', name: "SEC-III (MATLAB)", requiresDesk: true },
      { code: 'DBSAC', name: "DB Security and Access Control", requiresDesk: false },
      { code: 'DBSACL', name: "DB Security and Access Control Lab", requiresDesk: true }
    ]
  },
  '5B': {
    subjects: [
      { code: 'DAA', name: "Design and Analysis of Algorithms", requiresDesk: false },
      { code: 'DAAL', name: "Design and Analysis of Algorithms Lab", requiresDesk: true },
      { code: 'CD', name: "Compiler Design", requiresDesk: false },
      { code: 'CDL', name: "Compiler Design Lab", requiresDesk: true },
      { code: 'DBMS', name: "Database Management Systems", requiresDesk: false },
      { code: 'DBMSL', name: "Database Management Systems Lab", requiresDesk: true },
      { code: 'IVP', name: "Image and Video Processing", requiresDesk: false },
      { code: 'PDCB', name: "Personality Development & Career Building", requiresDesk: false },
      { code: 'BPLSE', name: "Blockchain Policy: Legal, Social and Economic Impact", requiresDesk: false },
      { code: 'ITR1', name: "Industrial Training-I", requiresDesk: false },
      { code: 'SEC3', name: "SEC-III (MATLAB)", requiresDesk: true },
      { code: 'DBSAC', name: "DB Security and Access Control (CS)", requiresDesk: false },
      { code: 'DBSACL', name: "DB Security and Access Control Lab (CS)", requiresDesk: true },
      { code: 'PCE', name: "Private Cloud Environment (CC)", requiresDesk: false },
      { code: 'PCEL', name: "Private Cloud Environment Lab (CC)", requiresDesk: true }
    ]
  },
  '5C': {
    subjects: [
      { code: 'DAA', name: "Design and Analysis of Algorithms", requiresDesk: false },
      { code: 'DAAL', name: "Design and Analysis of Algorithms Lab", requiresDesk: true },
      { code: 'CD', name: "Compiler Design", requiresDesk: false },
      { code: 'CDL', name: "Compiler Design Lab", requiresDesk: true },
      { code: 'DBMS', name: "Database Management Systems", requiresDesk: false },
      { code: 'DBMSL', name: "Database Management Systems Lab", requiresDesk: true },
      { code: 'IVP', name: "Image and Video Processing", requiresDesk: false },
      { code: 'PDCB', name: "Personality Development & Career Building", requiresDesk: false },
      { code: 'BPLSE', name: "Blockchain Policy: Legal, Social and Economic Impact", requiresDesk: false },
      { code: 'ITR1', name: "Industrial Training-I", requiresDesk: false },
      { code: 'SEC3', name: "SEC-III (MATLAB)", requiresDesk: true },
      { code: 'AMLP', name: "Advanced Machine Learning with Python Lab", requiresDesk: true },
      { code: 'DLNN', name: "Deep Learning and Neural Network Lab", requiresDesk: true }
    ]
  },
  '5D': {
    subjects: [
      { code: 'DAA', name: "Design and Analysis of Algorithms", requiresDesk: false },
      { code: 'DAAL', name: "Design and Analysis of Algorithms Lab", requiresDesk: true },
      { code: 'CD', name: "Compiler Design", requiresDesk: false },
      { code: 'CDL', name: "Compiler Design Lab", requiresDesk: true },
      { code: 'DBMS', name: "Database Management Systems", requiresDesk: false },
      { code: 'DBMSL', name: "Database Management Systems Lab", requiresDesk: true },
      { code: 'IVP', name: "Image and Video Processing", requiresDesk: false },
      { code: 'PDCB', name: "Personality Development & Career Building", requiresDesk: false },
      { code: 'BPLSE', name: "Blockchain Policy: Legal, Social and Economic Impact", requiresDesk: false },
      { code: 'ITR1', name: "Industrial Training-I", requiresDesk: false },
      { code: 'SEC3', name: "SEC-III (MATLAB)", requiresDesk: true },
      { code: 'AMLP', name: "Advanced Machine Learning with Python Lab", requiresDesk: true },
      { code: 'DLNN', name: "Deep Learning and Neural Network Lab", requiresDesk: true }
    ]
  },
  '5E': {
    subjects: [
      { code: 'DAA', name: "Design and Analysis of Algorithms", requiresDesk: false },
      { code: 'DAAL', name: "Design and Analysis of Algorithms Lab", requiresDesk: true },
      { code: 'CD', name: "Compiler Design", requiresDesk: false },
      { code: 'CDL', name: "Compiler Design Lab", requiresDesk: true },
      { code: 'DBMS', name: "Database Management Systems", requiresDesk: false },
      { code: 'DBMSL', name: "Database Management Systems Lab", requiresDesk: true },
      { code: 'IVP', name: "Image and Video Processing", requiresDesk: false },
      { code: 'PDCB', name: "Personality Development & Career Building", requiresDesk: false },
      { code: 'BPLSE', name: "Blockchain Policy: Legal, Social and Economic Impact", requiresDesk: false },
      { code: 'ITR1', name: "Industrial Training-I", requiresDesk: false },
      { code: 'SEC3', name: "SEC-III (MATLAB)", requiresDesk: true },
      { code: 'SWE', name: "Swift Essential (iOS)", requiresDesk: false },
      { code: 'SWEL', name: "Swift Essential Lab (iOS)", requiresDesk: true },
      { code: 'PBI', name: "Power BI (Data Science)", requiresDesk: false },
      { code: 'PBIL', name: "Power BI Lab (Data Science)", requiresDesk: true }
    ]
  }
};

var state = {};
var refreshTimer = null;

function $(id){ return document.getElementById(id); }

function fetchWithTimeout(url, opts) {
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, FETCH_TIMEOUT_MS);
  opts = opts || {};
  opts.signal = controller.signal;
  return fetch(url, opts).finally(function(){ clearTimeout(timer); });
}

function showMsg(text, type) {
  var el = $('msg');
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
  if (type !== 'error') setTimeout(function(){ el.style.display = 'none'; }, 4000);
}

function buildCards() {
  var wrap = $('cardsWrap');
  wrap.innerHTML = '';
  Object.keys(SECTION_CONFIG).forEach(function(section) {
    state[section] = { subject: SECTION_CONFIG[section].subjects[0].code, open: false };

    var card = document.createElement('div');
    card.className = 'section-card';
    card.id = 'card_' + section;

    var options = SECTION_CONFIG[section].subjects.map(function(s) {
      return '<option value="' + s.code + '">' + s.name + '</option>';
    }).join('');

    card.innerHTML =
      '<div class="sec-row"><div class="sec-title">Section ' + section + '</div></div>' +
      '<select class="subject-select" id="subject_' + section + '" onchange="onSubjectChange(\'' + section + '\')">' + options + '</select>' +

      '<label class="cs-label">Class Type *</label>' +
      '<select class="cs-select" id="ct_' + section + '" oninput="updateToggleGate(\'' + section + '\')">' +
        '<option value="">Select&hellip;</option>' +
        '<option value="Regular Class">Regular Class</option>' +
        '<option value="Extra Class">Extra Class</option>' +
        '<option value="Makeup Class">Makeup Class</option>' +
      '</select>' +

      '<label class="cs-label">Attendance Status *</label>' +
      '<select class="cs-select" id="cs_' + section + '" onchange="onClassStatusChange(\'' + section + '\')">' +
        '<option value="">Select&hellip;</option>' +
        '<option value="Completed">Completed</option>' +
        '<option value="Continued">Continued</option>' +
        '<option value="Mass Bunk">Mass Bunk</option>' +
        '<option value="College Function">College Function</option>' +
        '<option value="Holiday">Holiday</option>' +
        '<option value="Others">Others</option>' +
        '<option value="Internal Exam">Internal Exam</option>' +
      '</select>' +

      '<div class="cs-extra" id="csExtra_' + section + '">' +
        '<input type="text" id="topic_' + section + '" placeholder="Topic Covered *" oninput="updateToggleGate(\'' + section + '\')">' +
        '<input type="text" id="taughtby_' + section + '" placeholder="Taught By (your name) *" oninput="updateToggleGate(\'' + section + '\')">' +
        '<label class="cs-label">Time Slot (optional)</label>' +
        '<select class="cs-select" id="slot_' + section + '" style="margin-bottom:0;">' +
          '<option value="">Not specified</option>' +
          '<option value="S1">S1 &middot; 9:00&ndash;10:00</option>' +
          '<option value="S2">S2 &middot; 10:00&ndash;11:00</option>' +
          '<option value="S3">S3 &middot; 11:00&ndash;12:00</option>' +
          '<option value="S4">S4 &middot; 12:00&ndash;1:00</option>' +
          '<option value="S5">S5 &middot; 1:30&ndash;2:30</option>' +
          '<option value="S6">S6 &middot; 2:30&ndash;3:30</option>' +
          '<option value="S7">S7 &middot; 3:30&ndash;4:30</option>' +
        '</select>' +
      '</div>' +
      '<div class="cs-hint" id="csHint_' + section + '"></div>' +
      '<button class="btn-savestatus" id="saveStatus_' + section + '" onclick="saveNonCompletedStatus(\'' + section + '\')">Save Status (no attendance today)</button>' +
      '<div class="toggle-row">' +
        '<div class="toggle-label">Open Attendance</div>' +
        '<label class="toggle">' +
          '<input type="checkbox" id="toggle_' + section + '" disabled onchange="onToggle(\'' + section + '\', this.checked)">' +
          '<span class="slider"></span>' +
        '</label>' +
      '</div>' +
      '<div class="toggle-gate-note" id="gateNote_' + section + '">Set Class Type + Attendance Status to Completed, then fill Topic Covered + Taught By, to unlock this.</div>' +
      '<div class="status-line status-closed" id="status_' + section + '">Closed</div>' +
      '<div class="counts">' +
        '<div class="count-box"><div class="num" id="present_' + section + '">0</div><div class="lbl">PRESENT</div></div>' +
        '<div class="count-box green"><div class="num" id="oncampus_' + section + '">0</div><div class="lbl">ON-CAMPUS</div></div>' +
        '<div class="count-box red"><div class="num" id="offcampus_' + section + '">0</div><div class="lbl">OFF-CAMPUS</div></div>' +
      '</div>';
    wrap.appendChild(card);
  });
}

function onClassStatusChange(section) {
  var cs = $('cs_' + section).value;
  var extra = $('csExtra_' + section);
  var saveBtn = $('saveStatus_' + section);
  if (cs === 'Completed') {
    extra.style.display = 'block';
    saveBtn.style.display = 'none';
  } else if (cs) { // any selected status other than Completed means "no attendance today"
    extra.style.display = 'none';
    saveBtn.style.display = state[section].open ? 'none' : 'block';
  } else {
    extra.style.display = 'none';
    saveBtn.style.display = 'none';
  }
  updateToggleGate(section);
}

function updateToggleGate(section) {
  var cs = $('cs_' + section).value;
  var topic = $('topic_' + section).value.trim();
  var taughtBy = $('taughtby_' + section).value.trim();
  var classType = $('ct_' + section).value;
  var valid = cs === 'Completed' && topic && taughtBy && classType;
  var toggle = $('toggle_' + section);
  var note = $('gateNote_' + section);
  if (state[section].open) {
    toggle.disabled = false;
    note.style.display = 'none';
  } else {
    toggle.disabled = !valid;
    note.style.display = valid ? 'none' : 'block';
  }
}

function saveNonCompletedStatus(section) {
  var pin = $('pin').value.trim();
  if (!pin) { showMsg('Enter the admin PIN first.', 'error'); return; }
  var subject = state[section].subject;
  var classStatus = $('cs_' + section).value;
  fetchWithTimeout(GAS_URL, {
    method: 'POST', redirect: 'follow', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ type: 'log_class_status', section: section, subject: subject, classStatus: classStatus, pin: pin })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d && d.success) {
      showMsg('Logged: ' + section + ' (' + subjectName_(section, subject) + ') \u2014 ' + classStatus + '.', 'success');
    } else {
      showMsg((d && d.error) || 'Could not save status.', 'error');
    }
  })
  .catch(function(){ showMsg('Network problem saving status.', 'error'); });
}

function onSubjectChange(section) {
  state[section].subject = $('subject_' + section).value;
  $('cs_' + section).value = '';
  $('topic_' + section).value = '';
  $('taughtby_' + section).value = '';
  $('ct_' + section).value = '';
  $('slot_' + section).value = '';
  onClassStatusChange(section);
  refreshOne(section);
}

function onToggle(section, isOpen) {
  var pin = $('pin').value.trim();
  if (!pin) {
    showMsg('Enter the admin PIN before opening/closing a session.', 'error');
    $('toggle_' + section).checked = !isOpen;
    return;
  }
  var subject = state[section].subject;
  var payload = { type: 'session_toggle', section: section, subject: subject, action: isOpen ? 'open' : 'close', pin: pin };
  if (isOpen) {
    payload.classStatus = $('cs_' + section).value;
    payload.topicCovered = $('topic_' + section).value.trim();
    payload.taughtBy = $('taughtby_' + section).value.trim();
    payload.classType = $('ct_' + section).value;
    payload.timeSlot = $('slot_' + section).value;
  }

  fetchWithTimeout(GAS_URL, {
    method: 'POST', redirect: 'follow', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d && d.success) {
      state[section].open = isOpen;
      updateCard(section, isOpen);
      updateToggleGate(section);
      showMsg('Section ' + section + ' (' + subjectName_(section, subject) + ') attendance ' + (isOpen ? 'opened' : 'closed') + '.', 'success');
      manageRefresh();
    } else {
      showMsg((d && d.error) || 'Could not update session.', 'error');
      $('toggle_' + section).checked = !isOpen;
    }
  })
  .catch(function(){
    showMsg('Network problem toggling ' + section + '.', 'error');
    $('toggle_' + section).checked = !isOpen;
  });
}

function subjectName_(section, code) {
  var subs = SECTION_CONFIG[section].subjects;
  for (var i = 0; i < subs.length; i++) if (subs[i].code === code) return subs[i].name;
  return code;
}

function updateCard(section, isOpen) {
  var card = $('card_' + section);
  var status = $('status_' + section);
  card.classList.toggle('live', isOpen);
  status.textContent = isOpen ? 'Open — students can mark now' : 'Closed';
  status.className = 'status-line ' + (isOpen ? 'status-open' : 'status-closed');
}

function refreshCounts() {
  Object.keys(state).forEach(function(section) {
    if (!state[section].open) return;
    var subject = state[section].subject;
    fetchWithTimeout(GAS_URL + '?action=get_live_count&section=' + section + '&subject=' + subject)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.success) return;
        $('present_' + section).textContent = d.present;
        $('oncampus_' + section).textContent = d.onCampus;
        $('offcampus_' + section).textContent = d.offCampus;
      })
      .catch(function(){});
  });
}

function manageRefresh() {
  clearInterval(refreshTimer);
  var anyOpen = Object.keys(state).some(function(s){ return state[s].open; });
  if (anyOpen) {
    refreshCounts();
    refreshTimer = setInterval(refreshCounts, REFRESH_MS);
  }
}

function refreshOne(section) {
  var subject = state[section].subject;
  fetchWithTimeout(GAS_URL + '?action=get_session_status&section=' + section + '&subject=' + subject)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.success) return;
      var isOpen = !!d.open;
      state[section].open = isOpen;
      $('toggle_' + section).checked = isOpen;
      updateCard(section, isOpen);

      $('cs_' + section).value = d.classStatus || '';
      $('topic_' + section).value = d.topicCovered || '';
      $('taughtby_' + section).value = d.taughtBy || '';
      $('ct_' + section).value = d.classType || '';
      $('slot_' + section).value = d.timeSlot || '';
      onClassStatusChange(section);

      manageRefresh();
    })
    .catch(function(){});
}

buildCards();
Object.keys(SECTION_CONFIG).forEach(refreshOne);
</script>
</body>
</html>
