<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTF Participation — A Business Analyst's Read (Recorded Briefing)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4E9B8;
    --ink:#1E2A44;
    --ink-soft:#3C4A68;
    --red:#C0392B;
    --green:#2F6F4E;
    --white:#FFFDF6;
    --line:#D8C87F;
    --shadow: rgba(30,42,68,0.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:#20242e;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    height:100vh; overflow:hidden;
  }
  #stage{
    width:min(96vw, 1180px);
    aspect-ratio: 16/9;
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper) 0px, var(--paper) 38px, var(--line) 39px, var(--paper) 40px);
    border-radius: 10px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  /* Meeting chrome */
  .meeting-bar{
    position:absolute; top:0; left:0; right:0; height:44px;
    background: rgba(30,42,68,0.92);
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 16px; z-index:20;
  }
  .meeting-bar .left{ display:flex; align-items:center; gap:8px; }
  .rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--red); animation: blink 1.4s infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .presenter-bubble{
    position:absolute; bottom:70px; left:20px; z-index:20;
    width:110px; height:110px; border-radius:50%;
    border:3px solid var(--white); box-shadow:0 6px 18px var(--shadow);
    overflow:hidden; background: var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .presenter-bubble img{ width:100%; height:100%; object-fit:cover; display:block; }
  .presenter-bubble .initials{
    font-family:'Source Serif 4'; font-weight:700; font-size:2rem; color: var(--paper);
  }
  .presenter-bubble .mic-ring{
    position:absolute; inset:-4px; border-radius:50%;
    border: 2px solid var(--green); opacity:0;
  }
  .presenter-bubble.speaking .mic-ring{ animation: pulse 1.1s infinite; }
  @keyframes pulse{ 0%{ opacity:0.9; transform:scale(1);} 100%{ opacity:0; transform:scale(1.18);} }
  .presenter-name{
    position:absolute; bottom:56px; left:20px; width:110px; text-align:center; z-index:20;
    font-size:0.65rem; color:var(--white); background: rgba(30,42,68,0.75);
    border-radius:4px; padding:2px 0; font-weight:600;
  }
  /* Scenes */
  #scenes{ position:absolute; top:44px; bottom:150px; left:0; right:0; }
  .scene{
    position:absolute; inset:0;
    display:none;
    padding: 30px 40px 20px 150px;
    flex-direction:column;
  }
  .scene.active{ display:flex; }
  .eyebrow{
    font-family:'Kalam', cursive; font-size:1rem; color: var(--red); margin-bottom:4px; transform: rotate(-1deg); display:inline-block;
  }
  .eyebrow.good{ color: var(--green); }
  h1{
    font-family:'Source Serif 4', serif; font-weight:700; font-size:1.7rem; line-height:1.2; max-width:760px; margin-bottom:14px;
  }
  .visual{ flex:1; display:flex; align-items:center; gap:30px; min-height:0; }
  .visual-panel{
    flex:1; background:var(--white); border:2px solid var(--ink); border-radius:6px;
    box-shadow: 5px 5px 0 var(--shadow); padding:18px; max-height:100%; overflow:hidden;
  }
  /* small reused widgets */
  .bar-compare{ display:flex; flex-direction:column; gap:16px; margin-top:6px;}
  .bar-row label{ font-weight:600; font-size:0.82rem; display:block; margin-bottom:4px;}
  .bar-track{ background:#EFE6C4; border-radius:6px; height:26px; position:relative; overflow:hidden; border:1px solid var(--line);}
  .bar-fill{ height:100%; display:flex; align-items:center; color:white; font-weight:700; font-size:0.75rem; padding-left:8px; width:0%; transition: width 1.6s cubic-bezier(.2,.8,.2,1);}
  .bar-fill.normal{ background: var(--ink-soft); }
  .bar-fill.rtf{ background: var(--green); }
  .ledger{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ledger-card{ border:2px dashed var(--line); border-radius:6px; padding:12px; text-align:center;}
  .ledger-card h3{ font-family:'Source Serif 4'; font-size:1.1rem; }
  .ledger-card .num{ font-size:1.7rem; font-weight:700; }
  .gap-note{ margin-top:10px; text-align:center; font-family:'Kalam',cursive; color:var(--red); font-size:0.9rem;}
  .week-grid{ display:grid; grid-template-columns: 30px repeat(7,1fr); gap:3px; }
  .week-grid .head{ font-size:0.65rem; font-weight:600; text-align:center; color:var(--ink-soft); }
  .week-grid .cell{ height:26px; border-radius:3px; background:#EFE6C4; transition: background .4s ease; }
  .timetable{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .timetable table{ width:100%; min-width:420px; border-collapse:collapse; }
  .timetable th, .timetable td{
    border:1px solid var(--line); text-align:center; padding:5px 3px;
    font-size:0.68rem; line-height:1.2;
  }
  .timetable thead th{ background:var(--ink); color:var(--paper); font-weight:600; }
  .timetable td.slot-label{ background:#EFE6C4; font-weight:600; color:var(--ink-soft); white-space:nowrap; font-size:0.62rem; }
  .timetable td.free{ background:var(--white); }
  .timetable td.lec{ background:var(--ink-soft); color:white; font-weight:600; }
  .timetable td.lab{ background:var(--red); color:white; font-weight:600; }
  .legend{ display:flex; gap:12px; margin-top:8px; font-size:0.68rem; flex-wrap:wrap;}
  .legend span{ display:flex; align-items:center; gap:5px; }
  .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block;}
  .verdict{ margin-top:10px; padding:8px 10px; border-radius:5px; font-family:'Kalam',cursive; font-size:0.82rem; }
  .verdict.bad{ background:rgba(192,57,43,0.12); color:var(--red); }
  .verdict.good{ background:rgba(47,111,78,0.12); color:var(--green); }
  .fix-list{ display:flex; flex-direction:column; gap:8px; }
  .fix-item{ border:1px solid var(--line); border-radius:5px; padding:9px 11px; background:var(--white); opacity:0.35; transition: opacity .4s ease; }
  .fix-item.lit{ opacity:1; }
  .fix-item h4{ font-family:'Source Serif 4'; font-size:0.9rem; display:flex; align-items:center; gap:7px; }
  .fix-item p{ font-size:0.75rem; color:var(--ink-soft); margin-top:3px; }
  .fix-item .num{ width:18px; height:18px; border-radius:50%; background:var(--ink); color:white; font-size:0.65rem; display:inline-flex; align-items:center; justify-content:center; }
  .center-quote{ font-family:'Source Serif 4'; font-size:1.05rem; text-align:center; max-width:420px; margin:auto; }
  .center-quote.hand{ font-family:'Kalam',cursive; color:var(--red); font-size:1.25rem; }
  .calc-line{ font-size:0.8rem; color:var(--ink-soft); margin-bottom:8px; text-align:center; font-family:'Inter'; }
  /* Subtitle / caption bar */
  #captionBar{
    position:absolute; bottom:0; left:0; right:0; height:106px;
    background: rgba(30,42,68,0.95);
    padding: 12px 24px; z-index:20;
    display:flex; align-items:center;
  }
  #caption{
    color: var(--paper); font-size:0.98rem; line-height:1.45; max-width:900px;
  }
  /* Progress + controls */
  #controls{
    position:absolute; bottom: 106px; left:0; right:0; height:14px; z-index:25;
    background: rgba(0,0,0,0.15);
  }
  #progressFill{ height:100%; width:0%; background: var(--red); transition: width 0.2s linear; }
  #controlBtns{
    position:absolute; top:6px; right:16px; z-index:26;
    display:flex; align-items:center; gap:8px;
  }
  #playPause{
    background: var(--paper); color:var(--ink); border:none; border-radius:20px;
    padding:5px 14px; font-family:'Inter'; font-weight:700; font-size:0.75rem; cursor:pointer;
  }
  #restartBtn{
    background: transparent; color:var(--paper); border:1px solid var(--paper); border-radius:20px;
    padding:4px 12px; font-family:'Inter'; font-weight:600; font-size:0.72rem; cursor:pointer;
  }
  #prevBtn, #nextBtn{
    background: rgba(255,255,255,0.14); color: var(--paper);
    border:1px solid rgba(255,255,255,0.4); border-radius:20px;
    padding:4px 11px; font-family:'Inter'; font-weight:600; font-size:0.72rem; cursor:pointer;
  }
  #prevBtn:hover, #nextBtn:hover{ background: rgba(255,255,255,0.26); }
  #volumeWrap{
    position:absolute; top:6px; left:16px; z-index:26;
    display:flex; align-items:center; gap:6px;
  }
  #volIcon{ font-size:0.85rem; }
  #volumeSlider{
    width:80px; accent-color: var(--red); cursor:pointer;
  }
  #uploadNote{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    color:#9AA3B5; font-size:0.72rem; font-family:'Inter';
  }
  #startOverlay{
    position:absolute; inset:0; z-index:200;
    background: rgba(20,24,32,0.82);
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(2px);
  }
  .start-card{
    background: var(--white); border:2px solid var(--ink); border-radius:10px;
    padding:32px 36px; max-width:420px; text-align:center;
    box-shadow: 8px 8px 0 var(--shadow);
  }
  .start-title{ font-family:'Source Serif 4'; font-weight:700; font-size:1.2rem; color:var(--ink); margin-bottom:6px; }
  .start-sub{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:20px; }
  #startBtn{
    font-family:'Inter'; font-weight:700; font-size:1rem;
    background: var(--red); color:white; border:none; border-radius:30px;
    padding:14px 28px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.2);
  }
  #startBtn:active{ transform: translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,0.2); }
  .start-note{ font-size:0.7rem; color:#8a93a8; margin-top:16px; line-height:1.4; }
  #pauseOverlay{
    position:absolute; inset:0; z-index:150;
    display:none; align-items:center; justify-content:center; gap:26px;
    background: rgba(20,24,32,0.32);
    pointer-events:none;
  }
  #pauseOverlay.visible{ display:flex; }
  #pauseOverlay button{ pointer-events:auto; }
  .pause-nav{
    width:56px; height:56px; border-radius:50%;
    background: rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.55);
    color:white; font-size:1.3rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .pause-nav:hover{ background: rgba(255,255,255,0.3); }
  .pause-play{
    width:78px; height:78px; border-radius:50%;
    background: var(--red); border:none; color:white; font-size:1.8rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding-left:4px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  /* ============ Mobile ============ */
  /* Mobile / reel-style layout. Keyed off a JS-set class rather than a pure @media
     query, because 'Request Desktop Site' on mobile browsers overrides the CSS
     viewport — but window.screen.width still reports the real device size, so
     this stays correct even when that's toggled on. */
  body.mobile-view{ align-items:stretch; }
  body.mobile-view #stage{
    width:100vw; height:100vh; max-height:100dvh;
    aspect-ratio:unset; border-radius:0;
  }
  body.mobile-view .meeting-bar{ height:38px; padding:0 10px; }
  body.mobile-view .meeting-bar .title{ font-size:0.65rem; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.mobile-view .meeting-bar .timer{ font-size:0.68rem; }
  body.mobile-view .presenter-bubble{ width:52px; height:52px; bottom:auto; top:44px; left:8px; }
  body.mobile-view .presenter-name{ display:none; }
  body.mobile-view #scenes{ top:38px; bottom:128px; }
  /* The key fix: content is centered as ONE block, not stretched to fill the
     screen with the widget floating alone in the middle. */
  body.mobile-view .scene{
    padding:60px 20px 16px 20px;
    justify-content:center;
    gap:14px;
  }
  body.mobile-view .visual{ flex:none; }
  body.mobile-view .eyebrow{ font-size:1.05rem; }
  body.mobile-view h1{ font-size:1.55rem; line-height:1.32; margin-bottom:4px; }
  body.mobile-view .visual-panel{ width:100%; padding:18px; box-shadow:4px 4px 0 var(--shadow); }
  /* Scale up the inner widget text/elements, which were originally sized for a
     small side-panel on desktop, not a full-width mobile card */
  body.mobile-view .calc-line{ font-size:0.88rem; }
  body.mobile-view .bar-row label{ font-size:1rem; }
  body.mobile-view .bar-track{ height:34px; }
  body.mobile-view .bar-fill{ font-size:0.9rem; }
  body.mobile-view .ledger-card h3{ font-size:1.1rem; }
  body.mobile-view .ledger-card .num{ font-size:1.7rem; }
  body.mobile-view .gap-note{ font-size:0.95rem; }
  body.mobile-view .verdict{ font-size:0.95rem; padding:10px 12px; }
  body.mobile-view .legend{ font-size:0.85rem; gap:16px; }
  body.mobile-view .swatch{ width:14px; height:14px; }
  body.mobile-view .center-quote{ font-size:1.25rem; max-width:100%; }
  body.mobile-view .center-quote.hand{ font-size:1.4rem; }
  body.mobile-view .fix-item h4{ font-size:1.05rem; }
  body.mobile-view .fix-item p{ font-size:0.88rem; }
  body.mobile-view .timetable table{ min-width:0; }
  body.mobile-view .timetable th, body.mobile-view .timetable td{ font-size:0.72rem; padding:6px 3px; }
  body.mobile-view .timetable td.slot-label{ font-size:0.66rem; }
  body.mobile-view #controls{ bottom:96px; }
  body.mobile-view #volumeWrap{ top:auto; bottom:116px; left:10px; right:auto; }
  body.mobile-view #controlBtns{ top:auto; bottom:114px; right:10px; gap:5px; }
  body.mobile-view #restartBtn{ padding:4px 8px; font-size:0.6rem; }
  body.mobile-view #playPause{ padding:5px 10px; font-size:0.68rem; }
  body.mobile-view #prevBtn, body.mobile-view #nextBtn{ padding:4px 8px; font-size:0.6rem; }
  body.mobile-view #captionBar{ height:100px; padding:10px 16px; }
  body.mobile-view #caption{ font-size:0.92rem; line-height:1.4; }
  body.mobile-view .start-card{ max-width:88vw; padding:24px 20px; }
  body.mobile-view .start-title{ font-size:1.1rem; }
</style>
</head>
<body>
<script>
  // Detect real mobile devices even when "Request Desktop Site" is forcing a wide CSS viewport
  (function(){
    function applyMobileClass(){
      const isMobile = (window.screen && window.screen.width <= 700) || window.matchMedia('(max-width: 700px)').matches;
      document.body.classList.toggle('mobile-view', isMobile);
    }
    document.addEventListener('DOMContentLoaded', applyMobileClass);
    window.addEventListener('resize', applyMobileClass);
    window.addEventListener('orientationchange', applyMobileClass);
  })();
</script>
