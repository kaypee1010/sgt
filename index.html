<style>
  :root{
    --paper:#F6F8FF; --paper-raised:#FFFFFF; --ink:#1B2340; --ink-soft:#5B6478;
    --line:#D7DEF2; --blue:#2E3B8E; --blue-soft:#E9EDFF; --gold:#BE8F3A; --gold-soft:#F6EEDD;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1B2559; --paper-raised:#242E68; --ink:#F4F5FA; --ink-soft:#C2C8E8;
      --line:#3D4884; --blue:#9DACFB; --blue-soft:#2E3B8E; --gold:#F0C878; --gold-soft:#4A3B1E;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B2559; --paper-raised:#242E68; --ink:#F4F5FA; --ink-soft:#C2C8E8;
    --line:#3D4884; --blue:#9DACFB; --blue-soft:#2E3B8E; --gold:#F0C878; --gold-soft:#4A3B1E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
  }
  .card{
    width:100%; max-width:380px; text-align:center;
  }
  .avatar{
    width:88px; height:88px; border-radius:50%; object-fit:cover;
    border:3px solid var(--paper-raised); box-shadow:0 8px 24px rgba(24,34,56,.15);
    margin-bottom:18px;
  }
  h1{
    font-family:"Fraunces", Georgia, serif; font-weight:700; font-size:24px;
    margin:0 0 4px;
  }
  .role{ font-size:14px; color:var(--ink-soft); margin:0 0 28px; line-height:1.5; }
  .links{ display:flex; flex-direction:column; gap:12px; }
  a.link{
    display:flex; align-items:center; gap:12px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:12px; padding:14px 18px; text-decoration:none; color:var(--ink);
    font-size:15px; font-weight:600; text-align:left;
    box-shadow:0 2px 10px rgba(24,34,56,.06);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.link:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(24,34,56,.12); }
  .icon{ width:22px; height:22px; flex-shrink:0; color:var(--blue); }
  .icon svg{ width:100%; height:100%; display:block; }
  .sub{ font-size:12px; color:var(--ink-soft); font-weight:400; margin-top:2px; }
</style>
</head>
